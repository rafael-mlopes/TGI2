server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: rotas do React Router (ex.: /maquina/1/1/JOB-10001) devolvem o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome podem ser cacheados por longo prazo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
